examples:
  addAssignment:
    speakeasy-default-add-assignment:
      parameters:
        path:
          userId: "1"
          roleId: "123:owner"
      responses:
        "201":
          application/json: {"roles": ["123:owner"], "user_id": "1"}
  assignRoles:
    speakeasy-default-assign-roles:
      parameters:
        path:
          userId: "1"
      requestBody:
        application/json: ["123:owner"]
      responses:
        "200":
          application/json: ["123:owner"]
  getAssignedRolesForUser:
    speakeasy-default-get-assigned-roles-for-user:
      parameters:
        path:
          userId: "1"
      responses:
        "200":
          application/json: ["123:owner"]
  listAllAssignments:
    speakeasy-default-list-all-assignments:
      responses:
        "200":
          application/json: {"assignments": [{"roles": ["123:owner"], "user_id": "1"}]}
  removeAssignment:
    speakeasy-default-remove-assignment:
      parameters:
        path:
          userId: "1"
          roleId: "123:owner"
      responses:
        "200":
          application/json: {"roles": ["123:owner"], "user_id": "1"}
  createRole:
    parent_role_invalid_type:
      requestBody:
        application/json: {"expires_at": "2028-07-21T17:32:28Z", "grants": [{"action": "entity-read", "conditions": [{"attribute": "workflows.primary.task_name", "operation": "equals", "values": ["Qualification"]}], "effect": "allow", "resource": "entity:123:contact:f7c22299-ca72-4bca-8538-0a88eeefc947"}], "id": "123:owner", "name": "Owner", "organization_id": "123", "pricing_tier": "Professional", "slug": "owner", "type": "<value>"}
      responses:
        "400":
          application/json: {"message": "Parent role must be org_role or share_role, got user_role"}
    parent_role_different_org:
      requestBody:
        application/json: {"expires_at": "2028-07-21T17:32:28Z", "grants": [], "id": "123:owner", "name": "Owner", "organization_id": "123", "slug": "owner", "type": "<value>"}
      responses:
        "400":
          application/json: {"message": "Parent org_role must be in the same organization"}
    parent_role_max_hierarchy:
      requestBody:
        application/json: {"expires_at": "2028-07-21T17:32:28Z", "grants": [{"action": "entity-read", "conditions": [{"attribute": "workflows.primary.task_name", "operation": "equals", "values": ["Qualification"]}], "effect": "allow", "resource": "entity:123:contact:f7c22299-ca72-4bca-8538-0a88eeefc947"}], "id": "123:owner", "name": "Owner", "organization_id": "123", "partner_org_id": "123", "slug": "owner", "type": "<value>"}
      responses:
        "400":
          application/json: {"message": "Parent role cannot itself have a parent (max 2 levels of hierarchy)"}
    circular_dependency_self:
      requestBody:
        application/json: {"expires_at": "2028-07-21T17:32:28Z", "grants": [{"action": "entity-read", "conditions": [{"attribute": "workflows.primary.task_name", "operation": "equals", "values": ["Qualification"]}], "effect": "allow", "resource": "entity:123:contact:f7c22299-ca72-4bca-8538-0a88eeefc947"}], "id": "123:owner", "name": "Owner", "organization_id": "123", "slug": "owner", "type": "<value>"}
      responses:
        "400":
          application/json: {"message": "Role cannot be its own parent"}
